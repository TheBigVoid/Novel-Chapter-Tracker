<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Novel Chapter Tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <input id="novel-title" class="novel-title" aria-label="Novel title" placeholder="Untitled novel" maxlength="120">
      <p class="subtitle">Track which chapters are drafted, in revision, scheduled, or published.</p>
    </div>
  </header>

  <main class="wrap">
    <section class="stats" id="stats" aria-label="Summary"></section>

    <div class="progress" aria-hidden="true"><div class="progress-bar" id="progress-bar"></div></div>

    <section class="toolbar">
      <div class="filters" role="tablist" aria-label="Filter by status" id="filters"></div>
      <div class="toolbar-right">
        <input type="search" id="search" placeholder="Search chapters…" aria-label="Search chapters">
        <button class="btn primary" id="add-btn" type="button">+ Add chapter</button>
      </div>
    </section>

    <section id="list" class="list" aria-live="polite"></section>

    <footer class="data-tools">
      <span class="muted">Saved in this browser. Export a backup to move it to another device.</span>
      <div class="data-buttons">
        <button class="btn" id="export-btn" type="button">Export JSON</button>
        <label class="btn" for="import-file">Import JSON</label>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
      </div>
    </footer>
  </main>

  <dialog id="chapter-dialog">
    <form id="chapter-form" method="dialog">
      <h2 id="dialog-title">Add chapter</h2>
      <div class="grid">
        <label>Chapter #
          <input name="number" type="number" min="0" step="1" required>
        </label>
        <label>Status
          <select name="status"></select>
        </label>
        <label class="span-2">Title
          <input name="title" type="text" maxlength="200" placeholder="Optional">
        </label>
        <label>Word count
          <input name="words" type="number" min="0" step="1" placeholder="0">
        </label>
        <label>Publish date
          <input name="date" type="date">
        </label>
        <label class="span-2">Link
          <input name="link" type="url" placeholder="https://… (where it's published)">
        </label>
        <label class="span-2">Notes
          <textarea name="notes" rows="3" placeholder="Anything to remember about this chapter"></textarea>
        </label>
      </div>
      <p class="form-error" id="form-error" role="alert"></p>
      <div class="dialog-actions">
        <button class="btn danger" type="button" id="delete-btn">Delete</button>
        <span class="spacer"></span>
        <button class="btn" type="button" id="cancel-btn">Cancel</button>
        <button class="btn primary" type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
